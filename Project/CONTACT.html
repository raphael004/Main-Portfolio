<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | My Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>
</body>

    <header>
        <nav class="navbar">

            <a href="INDEX.html" class="logo">
                MyPortfolio
            </a>

            <ul class="nav-links">
                <h1><li><a href="INDEX.html">HOME</a></li><h1>
                <h1><li><a href="ABOUT.html">ABOUT</a></li><h1>
                <h1><li><a href="SERVICES.html">SERVICES</a></li><h1>
                <h1><li><a href="PROJECT.html">PROJECTS</a></li><h1>
                <h1><li><a href="CONTACT.html">CONTACT</a></li><h1>
            </ul>

        </nav>
    </header>

    <main>

        <section class="contact">

            <div class="contact-header">

                <p class="section-label">
                    CONTACT ME
                </p>

                <h1>
                    Let's Work Together
                </h1>

                <p>
                    Have a project in mind? Send me a message
                    and let's discuss your idea.
                </p>

            </div>


            <form class="contact-form">

                <div class="form-group">

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Your Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Your Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message"
                    ></textarea>

                </div>


                <button type="submit" class="btn">
                    Send Message
                </button>

            </form>

        </section>

    </main>
<script src="script.js"></script>
</body>
</html>
